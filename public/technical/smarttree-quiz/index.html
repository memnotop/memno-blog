<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTree 刷题</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #5b5bd6;
            --primary-dark: #4949bc;
            --primary-light: #ededff;
            --primary-glow: rgba(91,91,214,0.18);
            --success: #22C55E;
            --success-light: #DCFCE7;
            --error: #EF4444;
            --error-light: #FEE2E2;
            --warning: #F59E0B;
            --bg: #f5f6fb;
            --card-bg: #ffffff;
            --text: #202238;
            --text-light: #666a80;
            --text-muted: #9396a8;
            --border: #e7e8f0;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.10);
            --shadow-lg: 0 16px 40px rgba(0,0,0,0.14);
            --radius: 20px;
            --radius-sm: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 32px 16px 120px;
            position: relative;
        }

        /* ===== MODE SELECT SCREEN ===== */
        .mode-screen {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 680px;
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        .mode-screen.hidden { display: none; }

        .mode-screen h1 {
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            color: var(--text);
        }
        .mode-screen .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: -16px;
        }

        .mode-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 4px;
        }
        .mode-tab {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.25s;
        }
        .mode-tab.active {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        .mode-tab:hover:not(.active) { color: var(--text); }

        .group-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
            gap: 12px;
            max-height: 420px;
            overflow-y: auto;
            padding: 4px;
        }
        .group-grid.hidden { display: none; }

        .group-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            background: white;
            transition: all 0.25s;
            font-family: inherit;
            text-align: left;
            font-size: 0.92rem;
        }
        .group-card:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px var(--primary-glow);
        }
        .group-card .g-num {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: var(--primary-light);
            color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .group-card .g-info strong { display: block; font-size: 0.9rem; color: var(--text); }
        .group-card .g-info small { color: var(--text-muted); font-size: 0.8rem; }

        .start-all-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 6px 20px var(--primary-glow);
            transition: all 0.3s;
        }
        .start-all-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(91,91,214,0.35);
        }

        /* ===== QUIZ SCREEN ===== */
        .quiz-screen {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 680px;
            padding: 36px 32px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            position: relative;
        }
        .quiz-screen.hidden { display: none; }

        .quiz-screen::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary) 0%, #a78bfa 50%, var(--primary) 100%);
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 6px;
        }
        .quiz-header .q-type {
            background: var(--primary-light);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .quiz-header .q-group {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }
        .quiz-header .q-progress {
            font-weight: 700;
            color: var(--text);
            font-size: 1rem;
            background: var(--bg);
            padding: 6px 16px;
            border-radius: 20px;
        }

        .question-stem {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.8;
            color: var(--text);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px 20px;
            border: 2.5px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
            background: white;
            position: relative;
        }
        .option-item:hover {
            border-color: var(--primary);
            transform: translateX(4px);
            box-shadow: 0 4px 14px var(--primary-glow);
        }
        .option-item.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateX(4px);
            box-shadow: 0 4px 18px var(--primary-glow);
        }
        .option-item.correct {
            border-color: var(--success);
            background: var(--success-light);
            animation: pulse 0.5s ease;
        }
        .option-item.wrong {
            border-color: var(--error);
            background: var(--error-light);
            animation: shake 0.5s ease;
        }
        .option-item.dimmed { opacity: 0.55; }

        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
        }

        .option-key {
            width: 32px; height: 32px;
            border-radius: 8px;
            background: var(--bg);
            color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.22s;
        }
        .option-item.selected .option-key {
            background: var(--primary);
            color: white;
        }
        .option-item.correct .option-key {
            background: var(--success);
            color: white;
        }
        .option-item.wrong .option-key {
            background: var(--error);
            color: white;
        }
        .option-text { flex:1; font-size: 1rem; line-height: 1.7; padding-top: 3px; }

        .feedback {
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 1rem;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }
        .feedback.correct { background: var(--success-light); color: var(--success); border: 2px solid var(--success); }
        .feedback.wrong { background: var(--error-light); color: var(--error); border: 2px solid var(--error); }
        .feedback.hidden { display: none; }
        .explanation-box {
            margin-top: 14px;
            padding: 18px 22px;
            background: #f8f9ff;
            border-left: 4px solid var(--primary);
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.85;
            color: var(--text);
            text-align: left;
            font-weight: 400;
            animation: fadeIn 0.35s ease;
        }
        .explanation-box .exp-title {
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .explanation-box h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin: 12px 0 4px 0;
        }
        .explanation-box h3:first-child { margin-top: 0; }
        .explanation-box p { margin: 4px 0; }
        .explanation-box.hidden { display: none; }

        .quiz-footer {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .question-tools {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: -4px;
        }
        .btn-question-tool {
            padding: 10px 16px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: white;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-question-tool:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-1px);
        }
        .btn-question-tool.is-added {
            border-color: var(--error);
            color: var(--error);
            background: var(--error-light);
        }
        .btn-question-tool:disabled {
            cursor: default;
            opacity: 0.65;
        }

        .btn {
            padding: 14px 28px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.25s;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 16px var(--primary-glow);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(91,91,214,0.4); }
        .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2.5px solid var(--primary);
        }
        .btn-secondary:hover { background: var(--primary-light); transform: translateY(-2px); }
        .btn-back {
            background: var(--bg);
            color: var(--text-muted);
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
        }
        .btn-back:hover { color: var(--text); background: var(--border); }

        /* ===== END SCREEN ===== */
        .end-screen {
            text-align: center;
            padding: 48px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        .end-screen.hidden { display: none; }
        .end-screen h2 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
        }
        .end-screen .end-stats {
            display: flex; gap: 36px; justify-content: center; margin: 8px 0;
        }
        .end-stat { text-align: center; }
        .end-stat .val { font-size: 2.2rem; font-weight: 800; color: var(--text); }
        .end-stat .lbl { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; font-weight: 600; }

        /* ===== WRONG BOOK SIDEBAR ===== */
        .floating-wrong-btn {
            position: fixed;
            bottom: 20px; right: 20px;
            width: 64px; height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--error) 0%, #DC2626 100%);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(239,68,68,0.4);
            font-size: 1.6rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
            z-index: 900;
            animation: floatBounce 3s ease-in-out infinite;
        }
        @keyframes floatBounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .floating-wrong-btn:hover {
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 12px 36px rgba(239,68,68,0.5);
        }
        .floating-wrong-btn.hidden { transform: scale(0); opacity: 0; pointer-events: none; }
        .floating-wrong-btn .badge {
            position: absolute; top: -6px; right: -6px;
            background: var(--warning); color: white;
            font-size: 0.8rem; font-weight: 800;
            padding: 4px 9px; border-radius: 12px;
            min-width: 22px; text-align: center;
            box-shadow: 0 3px 10px rgba(245,158,11,0.45);
        }

        .overlay {
            position: fixed; top:0;left:0;right:0;bottom:0;
            background: rgba(0,0,0,0.45);
            z-index: 999;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.open { opacity: 1; pointer-events: auto; }

        .sidebar {
            position: fixed; top:0; right:0;
            width: 420px; max-width: 92vw; height: 100vh;
            background: white; box-shadow: -4px 0 28px rgba(0,0,0,0.15);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
            display: flex; flex-direction: column;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header {
            padding: 24px; border-bottom: 2px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: var(--primary-light);
        }
        .sidebar-header h3 { font-size: 1.3rem; font-weight: 800; }
        .sidebar-close {
            width: 40px; height: 40px; border-radius: 10px; border: none;
            background: white; cursor: pointer; font-size: 1.3rem;
            color: var(--text); transition: all 0.2s;
        }
        .sidebar-close:hover { background: var(--error-light); color: var(--error); }
        .sidebar-content { flex:1; overflow-y: auto; padding: 20px; }
        .sidebar-content::-webkit-scrollbar { width: 6px; }
        .sidebar-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

        .wrong-item {
            padding: 16px; border: 2px solid var(--border); border-radius: var(--radius-sm);
            margin-bottom: 12px; cursor: pointer; transition: all 0.2s; background: white;
        }
        .wrong-item:hover { border-color: var(--primary); background: var(--primary-light); }
        .wrong-item .wi-q { font-weight: 700; line-height: 1.5; margin-bottom: 8px; font-size: 0.95rem; }
        .wrong-item .wi-a { display: flex; gap: 16px; font-size: 0.85rem; font-weight: 600; }
        .wrong-item .wi-a .yours { color: var(--error); }
        .wrong-item .wi-a .correct-ans { color: var(--success); }
        .wrong-item .wi-footer {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-top: 8px;
            font-size: 0.8rem; color: var(--text-muted);
        }
        .wrong-item .wi-remove {
            flex-shrink: 0;
            border: 1.5px solid var(--error);
            border-radius: 8px;
            padding: 5px 10px;
            background: white;
            color: var(--error);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .wrong-item .wi-remove:hover { background: var(--error); color: white; }
        .sidebar-empty { text-align: center; padding: 60px 24px; color: var(--text-muted); }
        .sidebar-empty .icon { font-size: 4rem; margin-bottom: 16px; }
        .sidebar-empty .txt { font-size: 1.2rem; font-weight: 700; }

        .sidebar-footer {
            padding: 16px 24px; border-top: 2px solid var(--border);
            display: flex; gap: 10px;
        }
        .sidebar-footer button {
            flex:1; padding: 12px; border-radius: 10px; font-weight: 700;
            cursor: pointer; font-family: inherit; border: none; font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-clear-wrong {
            background: var(--error-light); color: var(--error);
        }
        .btn-clear-wrong:hover { background: var(--error); color: white; }
        .btn-review-wrong {
            background: var(--primary); color: white;
        }
        .btn-review-wrong:hover { background: var(--primary-dark); }

        /* ===== PIE CHART ===== */
        .pie-panel {
            position: fixed;
            bottom: 100px; right: 20px;
            background: rgba(255,255,255,0.96);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            padding: 12px;
            z-index: 890;
            backdrop-filter: blur(8px);
            border: 2px solid var(--border);
            transition: all 0.3s;
        }
        .pie-panel.minimized { padding: 8px; }
        .pie-panel canvas { display: block; cursor: pointer; }
        .pie-panel .pie-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; gap: 8px;
        }
        .pie-panel .pie-header span {
            font-size: 0.8rem; font-weight: 700; color: var(--text-muted);
        }
        .pie-panel .pie-header button {
            background: var(--bg); border: none; padding: 4px 10px;
            border-radius: 6px; cursor: pointer; font-size: 0.75rem;
            font-weight: 700; color: var(--text-muted); font-family: inherit;
        }
        .pie-panel .pie-header button:hover { color: var(--text); }
        .pie-panel.minimized .pie-header,
        .pie-panel.minimized canvas { display: none; }
        .pie-panel .pie-toggle {
            display: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--primary-light);
            border: 2px solid var(--primary);
            cursor: pointer;
            font-size: 1.2rem;
            align-items: center; justify-content: center;
            color: var(--primary);
            font-weight: 800;
        }
        .pie-panel.minimized .pie-toggle { display: flex; }

        .pie-tooltip {
            position: fixed;
            pointer-events: none;
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            z-index: 895;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .pie-tooltip.show { opacity: 1; }

        /* ===== RESUME MODAL ===== */
        .resume-modal {
            position: fixed; top:0;left:0;right:0;bottom:0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            display: flex; align-items: center; justify-content: center;
        }
        .resume-modal.hidden { display: none; }
        .resume-box {
            background: white; border-radius: var(--radius);
            padding: 40px; max-width: 400px; width: 90%;
            text-align: center; box-shadow: var(--shadow-lg);
        }
        .resume-box h3 { font-size: 1.3rem; margin-bottom: 8px; }
        .resume-box p { color: var(--text-muted); margin-bottom: 24px; line-height: 1.6; }
        .resume-box .btns { display: flex; gap: 12px; justify-content: center; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            body { padding: 16px 8px 100px; }
            .mode-screen, .quiz-screen { padding: 28px 20px; border-radius: 18px; }
            .quiz-screen::before { border-radius: 18px 18px 0 0; }
            .question-stem { font-size: 1.1rem; }
            .option-item { padding: 14px 16px; }
            .btn { padding: 12px 22px; font-size: 0.9rem; }
            .sidebar { width: 100%; max-width: 100%; }
            .floating-wrong-btn { width: 54px; height: 54px; bottom: 14px; right: 14px; font-size: 1.4rem; }
            .pie-panel { bottom: 84px; right: 8px; padding: 8px; }
            .group-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- ===== MODE SELECT SCREEN ===== -->
<div class="mode-screen" id="modeScreen">
    <h1>SmartTree 刷题</h1>
    <p class="subtitle">18 个题组 · <span id="totalQCount">1708</span> 题 · 进度自动保存</p>

    <div class="mode-tabs">
        <button class="mode-tab active" data-mode="all" id="tabAll">📋 顺序练习</button>
        <button class="mode-tab" data-mode="group" id="tabGroup">📦 分块练习</button>
    </div>

    <button class="start-all-btn" id="startAllBtn">开始顺序练习</button>

    <div class="group-grid hidden" id="groupGrid"></div>
</div>

<!-- ===== QUIZ SCREEN ===== -->
<div class="quiz-screen hidden" id="quizScreen">
    <div class="quiz-header">
        <span class="q-type" id="qTypeLabel">单选题</span>
        <span class="q-group" id="qGroupLabel"></span>
        <span class="q-progress" id="qProgress">1 / 1</span>
    </div>

    <div class="question-stem" id="qStem">题目加载中...</div>
    <div class="question-tools">
        <button class="btn-question-tool" id="addWrongBtn">＋ 加入错题本</button>
        <button class="btn-question-tool" id="backToCurrentBtn">↪ 回到当前</button>
    </div>
    <div class="options-list" id="optionsList"></div>
    <div class="feedback hidden" id="feedback"></div>

<script>
(() => {
  "use strict";

  // ========== DATA ==========
  const bank = window.QUIZ_BANK;
  if (!bank || !Array.isArray(bank.groups)) {
    document.body.innerHTML = '<main style="max-width:680px;margin:10vh auto;padding:32px;font-family:sans-serif"><h1>题库加载失败</h1><p>请确认数据完整。</p></main>';
    return;
  }

  const groups = bank.groups;
  const questions = groups.flatMap(g => g.questions.map(q => ({ ...q, groupId: g.id, groupTitle: g.title })));
  const questionMap = new Map(questions.map(q => [q.id, q]));
  const groupMap = new Map(groups.map(g => [g.id, g]));

  const STORE_KEY = "smarttree-simple-v3";
  const WRONG_STORE_KEY = "smarttree-wrong-book-v1";
  const TYPE_LABEL = { single: "单选题", multiple: "多选题", boolean: "判断题" };

  // ========== DOM REFS ==========
  const $ = s => document.querySelector(s);
  const modeScreen = $("#modeScreen");
  const quizScreen = $("#quizScreen");
  const endScreen = $("#endScreen");
  const groupGrid = $("#groupGrid");
  const startAllBtn = $("#startAllBtn");
  const qTypeLabel = $("#qTypeLabel");
  const qGroupLabel = $("#qGroupLabel");
  const qProgress = $("#qProgress");
  const qStem = $("#qStem");
  const explanationBox = $("#explanationBox");
  const optionsList = $("#optionsList");
  const feedback = $("#feedback");
  const confirmBtn = $("#confirmBtn");
  const nextBtn = $("#nextBtn");
  const prevBtn = $("#prevBtn");
  const addWrongBtn = $("#addWrongBtn");
  const backToCurrentBtn = $("#backToCurrentBtn");
  const wrongBtn = $("#wrongBtn");
  const wrongBadge = $("#wrongBadge");
  const sidebar = $("#sidebar");
  const sidebarContent = $("#sidebarContent");
  const overlay = $("#overlay");
  const piePanel = $("#piePanel");
  const pieCanvas = $("#pieCanvas");
  const pieTooltip = $("#pieTooltip");
  const resumeModal = $("#resumeModal");
  const resumeMsg = $("#resumeMsg");
  const tabAll = $("#tabAll");
  const tabGroup = $("#tabGroup");

  // ========== STATE ==========
  let quizMode = "all"; // "all" | "group"
  let quizGroupId = null;
  let questionPool = [];
  let currentIndex = 0;
  let currentQuestion = null;
  let selectedAnswers = new Set();
  let isAnswered = false;
  let correctCount = 0;
  let isReviewMode = false;
  let reviewRound = 0;
  let practiceCheckpoint = null;

  // Persistent wrong records: { [questionId]: { mistakes, lastSelected, ... } }
  let wrongRecords = {};

  // Session responses: remember each question's answer within current session
  // { [questionId]: { selected: string[], correct: boolean } }
  let sessionResponses = {};

  function poolIds(pool = questionPool) {
    return pool.map(q => q.id);
  }

  function samePool(ids, pool = questionPool) {
    if (!Array.isArray(ids) || ids.length !== pool.length) return false;
    return ids.every((id, i) => pool[i] && pool[i].id === id);
  }

  function makeCheckpoint(index = currentIndex) {
    return {
      quizMode,
      quizGroupId,
      isReviewMode,
      reviewRound,
      correctCount,
      pool: poolIds(),
      index: Math.max(0, Math.min(index, Math.max(0, questionPool.length - 1)))
    };
  }

  function resetCheckpoint(index = currentIndex) {
    practiceCheckpoint = makeCheckpoint(index);
  }

  function isWrongBookRecord(rec) {
    return !!rec && (rec.mistakes > 0 || rec.manual === true);
  }

  function hasBeenAnswered(rec) {
    return !!rec && (rec.answered === true || (Array.isArray(rec.lastSelected) && rec.lastSelected.length > 0));
  }

  // ========== PERSISTENCE ==========
  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function saveState() {
    try {
      const data = {
        quizMode, quizGroupId,
        pool: questionPool.map(q => q.id),
        index: currentIndex,
        correctCount,
        isReviewMode, reviewRound,
        wrongRecords,
        sessionResponses,
        practiceCheckpoint,
        updatedAt: Date.now()
      };
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
      localStorage.setItem(WRONG_STORE_KEY, JSON.stringify(wrongRecords));
    } catch (e) { /* storage full */ }
  }

  function loadWrongRecords() {
    try {
      const raw = localStorage.getItem(WRONG_STORE_KEY);
      if (raw) {
        wrongRecords = JSON.parse(raw) || {};
        return;
      }
    } catch (e) { /* fall back to legacy state */ }
    const state = loadState();
    if (state && state.wrongRecords) wrongRecords = state.wrongRecords;
  }

  function clearState() {
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* */ }
  }

  function clearWrongStorage() {
    try { localStorage.removeItem(WRONG_STORE_KEY); } catch (e) { /* */ }
  }

  // ========== ROUTING ==========
  function showModeScreen() {
    modeScreen.classList.remove("hidden");
    quizScreen.classList.add("hidden");
    endScreen.classList.add("hidden");
    renderGroupGrid();
  }

  function showQuizScreen() {
    modeScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");
    endScreen.classList.add("hidden");
  }

  function showEndScreen() {
    modeScreen.classList.add("hidden");
    quizScreen.classList.add("hidden");
    endScreen.classList.remove("hidden");
  }

  // ========== MODE SELECT ==========
  function renderGroupGrid() {
    $("#totalQCount").textContent = questions.length;

    const completedMap = {};
    if (wrongRecords) {
      for (const [id, rec] of Object.entries(wrongRecords)) {
        const q = questionMap.get(id);
        if (q && hasBeenAnswered(rec)) {
          if (!completedMap[q.groupId]) completedMap[q.groupId] = { tried: 0, wrong: 0 };
          completedMap[q.groupId].tried++;
          if (rec.mistakes > 0) completedMap[q.groupId].wrong++;
        }
      }
    }

    groupGrid.innerHTML = groups.map((g, i) => {
      const stats = completedMap[g.id] || { tried: 0, wrong: 0 };
      const total = g.questions.length;
      const errRate = stats.tried > 0 ? Math.round((stats.wrong / stats.tried) * 100) : 0;
      return `
        <button class="group-card" data-group-id="${g.id}">
          <span class="g-num">${String(i + 1).padStart(2, "0")}</span>
          <span class="g-info">
            <strong>${escHtml(g.title)}</strong>
            <small>${total} 题${stats.tried > 0 ? ` · 错误率 ${errRate}%` : ""}</small>
          </span>
        </button>`;
    }).join("");
  }

  // ========== SESSION ==========
  function startAllMode() {
    quizMode = "all";
    quizGroupId = null;
    isReviewMode = false;
    reviewRound = 0;
    questionPool = [...questions];
    currentIndex = 0;
    correctCount = 0;
    selectedAnswers = new Set();
    isAnswered = false;
    currentQuestion = null;
    sessionResponses = {};
    resetCheckpoint(0);
    showQuizScreen();
    renderQuestion();
    saveState();
  }

  function startGroupMode(groupId) {
    const g = groupMap.get(groupId);
    if (!g) return;
    quizMode = "group";
    quizGroupId = groupId;
    isReviewMode = false;
    reviewRound = 0;
    questionPool = g.questions.map(q => ({ ...q, groupId: g.id, groupTitle: g.title }));
    currentIndex = 0;
    correctCount = 0;
    selectedAnswers = new Set();
    isAnswered = false;
    currentQuestion = null;
    sessionResponses = {};
    resetCheckpoint(0);
    showQuizScreen();
    renderQuestion();
    saveState();
  }

  function startReviewRound() {
    // Collect wrong questions that haven't been mastered
    const wrongIds = Object.entries(wrongRecords)
      .filter(([, rec]) => isWrongBookRecord(rec))
      .map(([id]) => id);
    const pool = wrongIds.map(id => questionMap.get(id)).filter(Boolean);
    if (pool.length === 0) {
      alert("没有需要重练的错题！");
      return;
    }
    quizMode = "review";
    quizGroupId = null;
    isReviewMode = true;
    reviewRound++;
    questionPool = pool;
    currentIndex = 0;
    correctCount = 0;
    selectedAnswers = new Set();
    isAnswered = false;
    currentQuestion = null;
    sessionResponses = {};
    resetCheckpoint(0);
    closeSidebar();
    showQuizScreen();
    renderQuestion();
    saveState();
  }

  // ========== QUIZ RENDER ==========
  function renderQuestion() {
    if (currentIndex >= questionPool.length) {
      finishRound();
      return;
    }

    currentQuestion = questionPool[currentIndex];

    // Restore previous answer if already answered in this session
    const prev = sessionResponses[currentQuestion.id];
    if (prev) {
      selectedAnswers = new Set(prev.selected);
      isAnswered = true;
    } else {
      selectedAnswers = new Set();
      isAnswered = false;
    }

  // 极简 markdown 渲染（仅 h3 / 段落 / 加粗）
  function renderMd(md) {
    if (!md) return "";
    const lines = md.split(/\r?\n/);
    let out = "";
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) continue;
      const esc = line
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      if (/^###\s+/.test(line)) out += `<h3>${esc.replace(/^###\s+/, "")}</h3>`;
      else out += `<p>${esc}</p>`;
    }
    return out;
  }

  // ========== QUIZ ACTIONS ==========
  function selectOption(key) {
    if (isAnswered) return;
    const q = currentQuestion;
    const isMulti = q.type === "multiple";

    if (isMulti) {
      if (selectedAnswers.has(key)) selectedAnswers.delete(key);
      else selectedAnswers.add(key);

      confirmBtn.disabled = selectedAnswers.size === 0;
    } else {
      selectedAnswers.clear();

  function submitAnswer() {
    if (isAnswered || selectedAnswers.size === 0) return;

    const q = currentQuestion;
    const correctAnswers = q.answers || q.answer || [];
    const isCorrect = arraysEqual([...selectedAnswers].sort(), [...correctAnswers].sort());

    isAnswered = true;
    if (isCorrect) correctCount++;

    // Save response for session navigation
    sessionResponses[q.id] = {
      selected: [...selectedAnswers],
      correct: isCorrect
    };

    // Track all answers for stats (correct & wrong)
    if (!wrongRecords[q.id]) {
      wrongRecords[q.id] = { mistakes: 0, lastSelected: [], groupId: q.groupId, groupTitle: q.groupTitle };
    }
    wrongRecords[q.id].lastSelected = [...selectedAnswers];
    wrongRecords[q.id].answered = true;

    if (!isCorrect) {
      wrongRecords[q.id].mistakes++;
    } else {
      // Answered correctly — clear mistake count
      wrongRecords[q.id].mistakes = 0;
    }

    if (practiceCheckpoint && samePool(practiceCheckpoint.pool)) {
      if (currentIndex === practiceCheckpoint.index) {
        practiceCheckpoint.index = Math.min(currentIndex + 1, questionPool.length - 1);
      }
      practiceCheckpoint.correctCount = correctCount;
    }

    renderOptions();
    renderFeedback();
    updateQuestionTools();
    updateWrongButton();
    updatePieChart();

    confirmBtn.classList.add("hidden");
    nextBtn.classList.remove("hidden");
    prevBtn.classList.toggle("hidden", currentIndex === 0);

    saveState();
  }

  function goNext() {
    if (!isAnswered) {
      if (selectedAnswers.size > 0 && currentQuestion.type === "multiple") {
        submitAnswer();
        return;
      }
      // For single/boolean with selection, submit first
      if (selectedAnswers.size > 0 && currentQuestion.type !== "multiple") {
        submitAnswer();
        return;
      }
      return;
    }
    if (currentIndex < questionPool.length - 1) {
      currentIndex++;
      renderQuestion();
      saveState();
    } else {
      finishRound();
    }
  }

  function goPrev() {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
      saveState();
    }
  }

  function addCurrentToWrongBook() {
    if (!currentQuestion) return;
    const q = currentQuestion;
    if (!wrongRecords[q.id]) {
      wrongRecords[q.id] = {
        mistakes: 0,
        lastSelected: [],
        groupId: q.groupId,
        groupTitle: q.groupTitle,

  function returnToCurrentQuestion() {
    if (!practiceCheckpoint || !Array.isArray(practiceCheckpoint.pool)) return;
    const restoredPool = practiceCheckpoint.pool.map(id => questionMap.get(id)).filter(Boolean);
    if (restoredPool.length === 0) return;

    questionPool = restoredPool;
    quizMode = practiceCheckpoint.quizMode || "all";
    quizGroupId = practiceCheckpoint.quizGroupId || null;
    isReviewMode = practiceCheckpoint.isReviewMode || false;
    reviewRound = practiceCheckpoint.reviewRound || 0;
    correctCount = practiceCheckpoint.correctCount || 0;
    currentIndex = Math.min(practiceCheckpoint.index || 0, questionPool.length - 1);

  function finishRound() {
    const wrongInRound = questionPool.filter(q => {
      const rec = wrongRecords[q.id];
      return rec && rec.mistakes > 0;
    });

    // Check if any questions were answered wrong this round that haven't been retried
    const hasUnresolved = wrongInRound.some(q => {
      const rec = wrongRecords[q.id];
      return rec && rec.mistakes > 0;
    });

    if (hasUnresolved && wrongInRound.length > 0) {
      // Auto-retry: start a new round with wrong questions
      const wrongPool = wrongInRound.filter(q => {
        const rec = wrongRecords[q.id];
        return rec && rec.mistakes > 0;
      });

      if (wrongPool.length > 0) {
        isReviewMode = true;
        reviewRound++;
        questionPool = wrongPool;
        currentIndex = 0;
        correctCount = 0;
        selectedAnswers = new Set();
        isAnswered = false;
        currentQuestion = null;
        sessionResponses = {};
        resetCheckpoint(0);
        showQuizScreen();
        renderQuestion();
        saveState();
        return;
      }
    }

    // All done
    clearState();
    showEndScreen();
    renderEndStats();
  }

      $("#endMsg").textContent = `本轮答对 ${correctCount} / ${total} 题。`;

  }

  // ========== PIE CHART ==========
  function updatePieChart() {
    const canvas = pieCanvas;
    const ctx = canvas.getContext("2d");
    const size = canvas.width;
    const cx = size / 2, cy = size / 2;
    const radius = size / 2 - 6;

    ctx.clearRect(0, 0, size, size);

    // Calculate error rate per group
    const groupStats = groups.map(g => {
      let tried = 0, wrong = 0;
      for (const q of g.questions) {
        const rec = wrongRecords[q.id];
        if (!hasBeenAnswered(rec)) {
          continue;
        } else if (rec.mistakes > 0) {
          tried++;
          wrong++;
        } else {
          tried++;
        }
      }
      return {
        title: g.title,
        tried,
        wrong,
        rate: tried > 0 ? wrong / tried : 0
      };
    });

    const totalTried = groupStats.reduce((s, g) => s + g.tried, 0);

    if (totalTried === 0) {
      // Draw empty circle
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = "#e7e8f0";
      ctx.fill();
      ctx.fillStyle = "#9396a8";
      ctx.font = "11px 'Noto Sans SC', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("暂无数据", cx, cy + 4);
      return;
    }

    // Color: green (low error) to red (high error)
    function errorColor(rate) {
      // rate 0 → white #ffffff, rate 1 → red #EF4444
      const r = Math.round(0xFF - (0xFF - 0xEF) * rate);
      const g = Math.round(0xFF - (0xFF - 0x44) * rate);
      const b = Math.round(0xFF - (0xFF - 0x44) * rate);
      return `rgb(${r},${g},${b})`;
    }

    let angle = -Math.PI / 2;
    const slices = []; // store slice info for hover

    groupStats.forEach((gs, i) => {
      if (gs.tried === 0) return;
      const sliceAngle = (gs.tried / totalTried) * Math.PI * 2;
      const endAngle = angle + sliceAngle;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, angle, endAngle);
      ctx.closePath();
      ctx.fillStyle = errorColor(gs.rate);
      ctx.fill();

      // Border
      ctx.strokeStyle = "rgba(255,255,255,0.8)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      slices.push({ start: angle, end: endAngle, title: gs.title, rate: gs.rate, tried: gs.tried, wrong: gs.wrong });
      angle = endAngle;
    });

    // Center hole (donut style)
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();

    // Center text: total wrong count
    const totalWrong = groupStats.reduce((s, g) => s + g.wrong, 0);
    ctx.fillStyle = "#EF4444";
    ctx.font = "bold 16px 'Noto Sans SC', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`${totalWrong}`, cx, cy + 2);
    ctx.fillStyle = "#9396a8";
    ctx.font = "10px 'Noto Sans SC', sans-serif";
    ctx.fillText("错题", cx, cy + 18);

    // Store slices for hover
    canvas._slices = slices;
  }

  pieCanvas.addEventListener("mousemove", (e) => {
    const slices = pieCanvas._slices || [];
    const rect = pieCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const cx = pieCanvas.width / 2, cy = pieCanvas.height / 2;
    const dx = mx - cx, dy = my - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const radius = pieCanvas.width / 2 - 6;

    if (dist > radius || dist < radius * 0.55) {
      pieTooltip.classList.remove("show");
      return;
    }

    let ang = Math.atan2(dy, dx);
    if (ang < -Math.PI / 2) ang += Math.PI * 2;

    for (const s of slices) {
      let start = s.start, end = s.end;
      if (start < -Math.PI / 2 && ang > Math.PI) ang -= Math.PI * 2;
      if (ang >= start && ang < end) {
        pieTooltip.innerHTML = `<strong>${escHtml(s.title)}</strong><br>已答 ${s.tried} 题 · 错误率 ${Math.round(s.rate * 100)}%`;
        pieTooltip.style.left = (e.clientX + 14) + "px";
        pieTooltip.style.top = (e.clientY - 40) + "px";
        pieTooltip.classList.add("show");
        return;
      }
    }
    pieTooltip.classList.remove("show");
  });

    if (entries.length === 0) {

      const correctAnswers = q.answers || q.answer || [];
      const correctText = correctAnswers.map(k => {
        const opt = q.options.find(o => o.key === k);
        return opt ? `${k}. ${opt.text}` : k;
      }).join("、");
      const yourText = (rec.lastSelected || []).map(k => {
        const opt = q.options.find(o => o.key === k);

    }).join("");

    if (quizScreen.classList.contains("hidden")) return;

    const keyMap = { "1": "A", "2": "B", "3": "C", "4": "D", "5": "E", "6": "F" };

    if (keyMap[e.key] && !isAnswered) {
      const key = keyMap[e.key];
      const exists = currentQuestion?.options?.some(o => o.key === key);
      if (exists) {
        e.preventDefault();
        selectOption(key);
      }
      return;

    if (e.key === "Enter") {
      e.preventDefault();
      if (!isAnswered && selectedAnswers.size > 0) {
        submitAnswer();
      } else if (isAnswered) {
        goNext();
      }
      return;

    if (e.key === "ArrowLeft") {

      goPrev();

      goNext();
    }
  });

  // ========== RESUME ==========
  function tryResume() {
    const saved = loadState();
    if (!saved || !saved.pool || saved.pool.length === 0) return false;

    // Check if there's meaningful progress
    const savedProgressIndex = saved.practiceCheckpoint?.index ?? saved.index ?? 0;
    const hasResponses = Object.keys(saved.sessionResponses || {}).length > 0;
    if (savedProgressIndex === 0 && !hasResponses) return false;

    wrongRecords = saved.wrongRecords || {};
    sessionResponses = saved.sessionResponses || {};
    quizMode = saved.quizMode || "all";
    quizGroupId = saved.quizGroupId || null;

    const resumePoint = saved.practiceCheckpoint && Array.isArray(saved.practiceCheckpoint.pool)
      ? saved.practiceCheckpoint
      : {
          quizMode: saved.quizMode,
          quizGroupId: saved.quizGroupId,
          isReviewMode: saved.isReviewMode,
          reviewRound: saved.reviewRound,
          correctCount: saved.correctCount,
          pool: saved.pool,
          index: saved.index
        };

    resumeMsg.textContent = `上次${resumePoint.isReviewMode ? `错题重练（第${resumePoint.reviewRound}轮）` : "练习"}到第 ${(resumePoint.index || 0) + 1} 题，共 ${resumePoint.pool.length} 题。是否继续？`;
    resumeModal.classList.remove("hidden");

    // Store for resume
    resumeModal._saved = saved;
    resumeModal._resumePoint = resumePoint;
    return true;
  }

  $("#resumeBtn").addEventListener("click", () => {
    resumeModal.classList.add("hidden");
    const saved = resumeModal._saved;
    if (!saved) { showModeScreen(); return; }
    const resumePoint = resumeModal._resumePoint || saved;

    wrongRecords = saved.wrongRecords || {};
    sessionResponses = saved.sessionResponses || {};
    quizMode = resumePoint.quizMode || "all";
    quizGroupId = resumePoint.quizGroupId || null;
    isReviewMode = resumePoint.isReviewMode || false;
    reviewRound = resumePoint.reviewRound || 0;
    correctCount = resumePoint.correctCount || 0;

    // Rebuild pool from saved IDs
    const savedPoolIds = resumePoint.pool || [];
    questionPool = savedPoolIds.map(id => questionMap.get(id)).filter(Boolean);
    currentIndex = Math.min(resumePoint.index || 0, questionPool.length - 1);
    practiceCheckpoint = {
      quizMode,
      quizGroupId,
      isReviewMode,
      reviewRound,
      correctCount,
      pool: poolIds(),
      index: currentIndex
    };
    selectedAnswers = new Set();
    isAnswered = false;
    currentQuestion = null;

    showQuizScreen();
    renderQuestion();
    updateWrongButton();
    updatePieChart();
  });

  $("#freshStartBtn").addEventListener("click", () => {
    resumeModal.classList.add("hidden");
    clearState();
    wrongRecords = {};
    clearWrongStorage();
    sessionResponses = {};
    practiceCheckpoint = null;
    showModeScreen();
    updateWrongButton();
    updatePieChart();
  });

  // ========== INIT ==========
  function init() {
    loadWrongRecords();
    updateWrongButton();
    updatePieChart();

    if (tryResume()) {
      // Resume modal is showing; mode screen will show if user declines
      showModeScreen();
      updateWrongButton();
      updatePieChart();
      renderGroupGrid();
    } else {
      showModeScreen();
      renderGroupGrid();
    }
  }

  // ========== UTILS ==========
  function escHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function arraysEqual(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) {
      if (a[i] !== b[i]) return false;
    }
    return true;
  }

  init();
})();
</script>
</body>
</html>
